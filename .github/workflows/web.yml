name: Web App

on:
  push:
    paths:
      - 'apps/web/**'
      - 'supabase/functions/bullmatch-api/**'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - 'supabase/functions/bullmatch-api/**'
      - '.github/workflows/web.yml'

permissions:
  contents: read

concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install locked dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund

      - name: Typecheck and build
        working-directory: apps/web
        run: npm run build

      - name: Smoke controlled production API
        shell: bash
        run: |
          set -euo pipefail
          API='https://kaanguobjhlusjvgbowt.supabase.co/functions/v1/bullmatch-api'
          dashboard_status="$(curl --fail-with-body --silent --show-error --output /tmp/bmi-dashboard.json --write-out '%{http_code}' "$API?resource=dashboard")"
          test "$dashboard_status" = '200'
          python - <<'PY'
          import json
          with open('/tmp/bmi-dashboard.json', encoding='utf-8') as f:
              body=json.load(f)
          data=body.get('data')
          assert isinstance(data, dict), body
          for key in ('bulls','published_matches','venues','last_published_at'):
              assert key in data, (key, body)
          PY
          me_status="$(curl --silent --show-error --output /tmp/bmi-me.json --write-out '%{http_code}' "$API?resource=me")"
          test "$me_status" = '401'

      - name: Configure Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
