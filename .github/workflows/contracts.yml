name: Validate shared contracts

on:
  pull_request:
    paths:
      - 'packages/contracts/**'
      - 'docs/AI-AGENT-SPEC.md'
      - 'scripts/validate_contracts.py'
      - '.github/workflows/contracts.yml'
  push:
    branches: [main]
    paths:
      - 'packages/contracts/**'
      - 'docs/AI-AGENT-SPEC.md'
      - 'scripts/validate_contracts.py'
      - '.github/workflows/contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install validator
        run: python3 -m pip install 'jsonschema[format]==4.26.0'

      - name: Validate schemas and examples
        run: python3 scripts/validate_contracts.py
